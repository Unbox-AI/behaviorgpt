[project]
name = "behaviorgpt"
version = "0.1.0"
description = "Python client for BehaviorGPT, UnboxAI's Large Behavioral Model for search, recommendations and personalization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Unbox AI" }]
keywords = ["recommendations", "personalization", "search", "behavioral model", "unboxai"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://unboxai.com/behaviorgpt"
Repository = "https://github.com/Unbox-AI/behaviorgpt"
Demo = "https://behaviorgpt.unboxai.com/"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "ruff>=0.16.2",
    "tqdm>=4.70.1",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    "notebooks/*"
]

[tool.ruff.lint.isort]
known-first-party = ["behaviorgpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
